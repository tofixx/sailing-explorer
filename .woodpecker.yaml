# CI/CD für Sail Explorer (Woodpecker 3).
# Prüft jeden Push und Pull Request; deployt nur vom Standardzweig nach Cloudflare.
# Benötigtes Repo-Secret (nur für den Deploy-Schritt freigeben; Account-ID steht in wrangler.jsonc):
#   cloudflare_api_token – API-Token mit
#     Konto: Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Account Settings:Read
#     Zone wollow.ski: Workers Routes:Edit, DNS:Edit (für die Custom Domain)

when:
  - event: [push, pull_request, manual]

steps:
  - name: install
    image: node:22-bookworm-slim
    commands:
      - npm ci --no-audit --no-fund

  - name: check
    image: node:22-bookworm-slim
    commands:
      - npm run typecheck
      - npm test
      - npm run build

  - name: deploy
    image: node:22-bookworm-slim
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
    commands:
      - npx wrangler d1 migrations apply sailing-explorer --remote
      - npx wrangler deploy
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}
