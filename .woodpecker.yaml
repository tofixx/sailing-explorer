# CI/CD für Sail Explorer (Woodpecker 3).
# Prüft jeden Push und Pull Request; deployt nur vom Standardzweig nach Cloudflare.
# Benötigtes Repo-Secret (nur für den Deploy-Schritt freigeben; Account-ID steht in wrangler.jsonc):
#   cloudflare_api_token – API-Token mit
#     Konto: Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Account Settings:Read
#     Zone wollow.ski: Workers Routes:Edit, DNS:Edit (für die Custom Domain)

when:
  - event: [push, pull_request, pull_request_closed, manual]

# Auf dem NUC bauen (Label speed=fast). edda ist ein NAS und soll nicht bauen –
# siehe Notion „CI/CD: Forgejo, Woodpecker & Registry“.
labels:
  speed: fast

steps:
  - name: install
    image: node:22-bookworm
    commands:
      - npm ci --no-audit --no-fund
    when:
      - event: [push, pull_request, manual]

  - name: check
    image: node:22-bookworm
    commands:
      - npm run typecheck
      - npm test
      - npm run build
    when:
      - event: [push, pull_request, manual]

  - name: deploy
    image: node:22-bookworm
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
    commands:
      - npx wrangler d1 migrations apply sailing-explorer --remote
      - npx wrangler deploy
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}

  # Jeder andere Branch: eigene Vorschau unter sailing-<branch>.wollow.ski
  # (eigener Worker, Vorschau-Datenbank und -Bucket; Anmeldung dort gesperrt).
  - name: preview
    image: node:22-bookworm
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
    commands:
      - node scripts/deploy-preview.mjs deploy "$CI_COMMIT_BRANCH"
    when:
      - event: [push, manual]
        branch:
          exclude: ${CI_REPO_DEFAULT_BRANCH}

  # Pull Request geschlossen/gemergt: Vorschau wieder entfernen
  - name: preview-cleanup
    image: node:22-bookworm
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
    commands:
      - npm ci --no-audit --no-fund
      - node scripts/deploy-preview.mjs delete "$CI_COMMIT_SOURCE_BRANCH"
    when:
      - event: pull_request_closed
