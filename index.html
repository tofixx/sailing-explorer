<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sail Explorer</title>
    <meta name="description" content="Segeltörns auf der Seekarte mit Wind- und Wellendaten" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sail Explorer" />
    <meta property="og:description" content="Segeltörns auf der Seekarte mit Wind- und Wellendaten" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111d29" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app" data-empty>
      <sx-topbar></sx-topbar>
      <div class="workspace">
        <main class="map-area" aria-label="Karte">
          <div id="map"></div>
          <sx-empty-state>
            <sx-discover slot="discover" variant="strip" hidden></sx-discover>
          </sx-empty-state>
        </main>
        <aside class="sidebar" aria-label="Auswertung">
          <sx-panel heading="Bedingungen">
            <span slot="aside" id="conditions-ctx" class="num"></span>
            <sx-conditions></sx-conditions>
          </sx-panel>
          <sx-panel heading="Track einfärben">
            <sx-metric-picker></sx-metric-picker>
          </sx-panel>
          <sx-panel heading="Reise">
            <sx-kpis></sx-kpis>
          </sx-panel>
          <sx-panel heading="Verlauf" id="charts-panel" hidden>
            <div id="weather-wrap">
              <sx-time-chart id="weather-chart" label="Wind, Böen und Wellen über die Zeit"></sx-time-chart>
            </div>
            <sx-time-chart id="speed-chart" label="Geschwindigkeit über die Zeit"></sx-time-chart>
          </sx-panel>
          <sx-panel heading="Tracks">
            <button slot="aside" id="tracks-aside" class="link-btn" type="button">Alle entfernen</button>
            <sx-track-list></sx-track-list>
            <p class="sources">
              Wind (10 m) und Seegang: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>, stündlich.
              Speed aus den GPX-Zeitstempeln, GPS-Ausreißer werden erkannt und entfernt.
            </p>
          </sx-panel>
        </aside>
      </div>
      <sx-profile-page hidden></sx-profile-page>
      <sx-discover id="discover-page" variant="page" hidden></sx-discover>
    </div>
    <sx-toast></sx-toast>
    <sx-login-dialog></sx-login-dialog>
    <sx-share-dialog></sx-share-dialog>
    <sx-account-dialog></sx-account-dialog>
  </body>
</html>
